<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn Web</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top, #006eff 0%, #00152f 35%, #02060d 75%);
    color:white;
    overflow:hidden;
}

.container{
    width:92%;
    max-width:500px;
    padding:28px 22px;
    border-radius:22px;
    background:rgba(2,10,25,.92);
    border:1px solid #087cff;
    box-shadow:
        0 0 25px #006eff66,
        inset 0 0 25px #006eff18;
}

h1{
    text-align:center;
    margin-bottom:22px;
    font-size:28px;
    color:#fff;
    text-shadow:0 0 12px #008cff;
}

.web-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.web-btn{
    border:1px solid #087cff;
    background:linear-gradient(145deg,#061b38,#020812);
    color:#fff;
    padding:14px 7px;
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 0 8px #006eff22;
}

.web-btn:hover{
    transform:translateY(-2px);
    border-color:#32aaff;
    box-shadow:0 0 15px #008cff88;
}

.web-btn.selected{
    background:linear-gradient(145deg,#087cff,#003b82);
    box-shadow:0 0 18px #008cffaa;
}

input{
    width:100%;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    border:1px solid #087cff;
    outline:none;
    background:#030a15;
    color:white;
    font-size:14px;
    box-shadow:0 0 10px #006eff22;
}

input::placeholder{
    color:#8da4bf;
}

.start{
    width:100%;
    margin-top:13px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#006eff,#00a2ff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 18px #008cff66;
}

.start:hover{
    box-shadow:0 0 25px #008cffaa;
}

#loadingScreen{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,5,15,.97);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:10;
}

.loading-box{
    width:85%;
    max-width:400px;
    text-align:center;
}

.percent{
    font-size:42px;
    font-weight:bold;
    color:#00a2ff;
    text-shadow:0 0 18px #008cff;
    margin-bottom:18px;
}

.progress{
    width:100%;
    height:13px;
    background:#071323;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #087cff;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#006eff,#00c8ff);
    box-shadow:0 0 15px #00aaff;
    transition:width:.1s linear;
}

.loading-text{
    margin-top:15px;
    color:#9fcfff;
}

#successScreen{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,5,15,.97);
    justify-content:center;
    align-items:center;
    z-index:20;
}

.success-box{
    width:90%;
    max-width:500px;
    padding:28px 20px;
    border-radius:20px;
    text-align:center;
    background:#030b18;
    border:1px solid #00a2ff;
    box-shadow:0 0 30px #008cff66;
}

.success{
    font-size:30px;
    font-weight:bold;
    color:#20c8ff;
    text-shadow:0 0 15px #008cff;
    margin-bottom:18px;
}

.download-link{
    display:block;
    color:#8fdcff;
    font-size:13px;
    line-height:1.5;
    word-break:break-all;
}
</style>
</head>

<body>

<div class="container">
    <h1>Chọn Web</h1>

    <div class="web-list">
        <button class="web-btn">Link4m</button>
        <button class="web-btn">Link2m</button>

        <button class="web-btn">Layma.net</button>
        <button class="web-btn">Traffic4k.com</button>

        <button class="web-btn">Phienchoso.com</button>
        <button class="web-btn">bbmkt.com</button>

        <button class="web-btn">site2s.com</button>
        <button class="web-btn">app.trafficviet.vn</button>
    </div>

    <input type="text" id="linkInput" placeholder="nhập link web ở đây">

    <button class="start" onclick="startLoading()">Bắt đầu</button>
</div>

<!-- LOADING -->
<div id="loadingScreen">
    <div class="loading-box">
        <div class="percent" id="percent">1%</div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="loading-text">Đang xử lý...</div>
    </div>
</div>

<!-- SUCCESS -->
<div id="successScreen">
    <div class="success-box">
        <div class="success">Thành công</div>

        <div class="download-link">
            https://www.mediafire.com/file/eqtafone1087zpd/Roblox+VNG+Mở+Các+Game+bị+ẩn.zip/file
        </div>
    </div>
</div>

<script>
const buttons = document.querySelectorAll(".web-btn");

buttons.forEach(button => {
    button.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("selected"));
        button.classList.add("selected");
    });
});

function startLoading(){

    const link = document.getElementById("linkInput").value.trim();

    if(link === ""){
        alert("Vui lòng nhập link web!");
        return;
    }

    document.getElementById("loadingScreen").style.display = "flex";

    let percent = 1;

    const timer = setInterval(() => {

        document.getElementById("percent").textContent = percent + "%";
        document.getElementById("progressBar").style.width = percent + "%";

        if(percent >= 100){
            clearInterval(timer);

            setTimeout(() => {
                document.getElementById("loadingScreen").style.display = "none";
                document.getElementById("successScreen").style.display = "flex";
            }, 300);
        }

        percent++;

    }, 100);
}
</script>

</body>
</html>
